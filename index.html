<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linkree</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <main class="container">
      <img class="avatar" src="image/my picture.jpeg" alt="my picture" />
      <h1 class="name">Maryam</h1>
      <p class="bio">I help businesses and founders turn QUIET pages into pages people NOTICE </p>

      <div class="links">
        <a class="btn" href="https://maryamayandiran.github.io/maryam-smm-portfolio/" target="_blank" rel="noopener">Portfolio</a>
        <a class="btn" href="https://x.com/maryamonsocials" target="_blank" rel="noopener noreferrer" data-app-url="twitter://user?screen_name=maryamonsocials">Twitter/X</a>
        <a class="btn" href="https://www.linkedin.com/in/ayandiran-maryam-56062235a" target="_blank" rel="noopener">LinkedIn</a>
        <a class="btn" href="https://www.instagram.com/maryamonsocials_" target="_blank" rel="noopener noreferrer" data-app-url="instagram://user?username=maryamonsocials_">Instagram</a>
      </div>

      <footer>
         <div class="footer-container">
            <p>&copy;Maryam 2026</p>
        </div>
      </footer>
    </main>
    <script>
      (function(){
        document.addEventListener('click', function(e){
          var a = e.target.closest && e.target.closest('a[data-app-url]');
          if(!a) return;
          var appUrl = a.getAttribute('data-app-url');
          var webUrl = a.href;
          var now = Date.now();
          // try open the native app
          window.location = appUrl;
          // fallback to web after short delay
          setTimeout(function(){
            if(Date.now() - now < 1200) window.location = webUrl;
          }, 800);
          e.preventDefault();
        }, false);
      })();
    </script>
  </body>
</html>
