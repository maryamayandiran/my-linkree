<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Maryam Ayandiran - Links</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="page">
      <section class="profile" aria-label="Maryam's profile">
        <img class="avatar" src="image/my picture.jpeg" alt="Portrait of Maryam" />
        <p class="role">SOCIAL MEDIA MANAGER</p>
        <h1>Hi, I'm Maryam.</h1>
        <p class="bio">I help businesses and founders turn <strong>QUIET pages</strong> into pages people <strong>NOTICE</strong></p>
      </section>

      <nav class="links" aria-label="Social and portfolio links">
        <a class="primary" href="https://maryamayandiran.github.io/maryam-smm-portfolio/" target="_blank" rel="noopener noreferrer">
          View my portfolio
        </a>
        <a class="social-link" href="https://x.com/maryamonsocials" target="_blank" rel="noopener noreferrer" data-app-url="twitter://user?screen_name=maryamonsocials">
          <span class="social-name">X / Twitter</span><span class="social-handle">@maryamonsocials</span>
        </a>
        <a class="social-link" href="https://www.instagram.com/maryamonsocials_/" target="_blank" rel="noopener noreferrer" data-app-url="instagram://user?username=maryamonsocials_">
          <span class="social-name">Instagram</span><span class="social-handle">@maryamonsocials_</span>
        </a>
        <a class="social-link" href="https://www.linkedin.com/in/ayandiran-maryam-56062235a" target="_blank" rel="noopener noreferrer">
          <span class="social-name">LinkedIn</span><span class="social-handle">Let's connect</span>
        </a>
      </nav>

      <footer class="footer">Available for remote work</footer>
    </main>
    <script>
      (function(){
        document.addEventListener('click', function(e){
          var a = e.target.closest && e.target.closest('a[data-app-url]');
          if(!a) return;
          var appUrl = a.getAttribute('data-app-url');
          var webUrl = a.href;
          var now = Date.now();
          // try open the native app
          window.location = appUrl;
          // fallback to web after short delay
          setTimeout(function(){
            if(Date.now() - now < 1200) window.location = webUrl;
          }, 800);
          e.preventDefault();
        }, false);
      })();
    </script>
  </body>
</html>
